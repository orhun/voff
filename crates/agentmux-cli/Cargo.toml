[package]
name="agentmux-cli"
version.workspace=true
edition.workspace=true
rust-version.workspace=true
[[bin]]
name="agentmux"
path="src/main.rs"
[dependencies]
agentmux-tui.workspace=true
agentmux-config={path="../agentmux-config"}
agentmux-core.workspace=true
agentmux-provider.workspace=true
agentmux-providers.workspace=true
agentmux-storage.workspace=true
agentmux-tools={path="../agentmux-tools"}
anyhow="1"
clap={version="4",features=["derive"]}
tokio.workspace=true
chrono.workspace=true
tracing="0.1"
tracing-subscriber={version="0.3",features=["env-filter"]}
[lints]
workspace=true
