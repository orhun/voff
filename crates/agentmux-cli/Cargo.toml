[package]
name="agentmux-cli"
version.workspace=true
edition.workspace=true
rust-version.workspace=true
license.workspace=true
[[bin]]
name="agentmux"
path="src/main.rs"
[dependencies]
agentmux-tui.workspace=true
agentmux-config={path="../agentmux-config",version="=0.1.0-beta.1"}
agentmux-core.workspace=true
agentmux-provider.workspace=true
agentmux-providers.workspace=true
agentmux-storage.workspace=true
agentmux-tools={path="../agentmux-tools",version="=0.1.0-beta.1"}
anyhow="1"
clap={version="4",features=["derive"]}
tokio.workspace=true
chrono.workspace=true
tracing="0.1"
tracing-subscriber={version="0.3",features=["env-filter"]}
serde={version="1",features=["derive"]}
serde_json="1"
toml="0.8"
[lints]
workspace=true
[dev-dependencies]
tempfile="3"
