[package]
name="voff-cli"
version.workspace=true
edition.workspace=true
rust-version.workspace=true
license.workspace=true
[[bin]]
name="voff"
path="src/main.rs"
[dependencies]
voff-tui.workspace=true
voff-config={path="../voff-config",version="=0.1.0-beta.1"}
voff-core.workspace=true
voff-provider.workspace=true
voff-providers.workspace=true
voff-storage.workspace=true
voff-tools={path="../voff-tools",version="=0.1.0-beta.1"}
anyhow="1"
clap={version="4",features=["derive"]}
tokio.workspace=true
chrono.workspace=true
tracing="0.1"
tracing-subscriber={version="0.3",features=["env-filter"]}
serde={version="1",features=["derive"]}
serde_json="1"
toml="0.8"
[lints]
workspace=true
[dev-dependencies]
tempfile="3"
