[package]
name = "voff-provider"
description = "Provider integrations for Voff coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
test-support = []
[dependencies]
voff-core.workspace = true
async-trait.workspace = true
rig-core = { version = "0.42", default-features = false, features = [
  "reqwest",
  "rustls",
] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2"
voff-prompts = { version = "0.1.0", path = "../voff-prompts" }
[lints]
workspace = true
