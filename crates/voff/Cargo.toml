[package]
name = "voff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[[bin]]
name = "voff"
path = "src/main.rs"
[dependencies]
voff-core.workspace = true
voff-provider.workspace = true
voff-storage.workspace = true
voff-engine.workspace = true
voff-tools = { path = "../voff-tools", version = "=0.1.0-beta.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
chrono.workspace = true
crossterm = "0.29"
ratatui = { version = "0.30.1", features = ["unstable-rendered-line-info"] }
ratatui-explorer = "0.3"
ratatui-textarea = "0.9.2"
rataflow = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing.workspace = true
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror.workspace = true
ansi-to-tui = "=8.0.1"
ratatui-notifications = "0.1.0"
llm-kernel = { version = "0.31.6", default-features = false, features = ["provider"] }
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2.2"
tokio-util.workspace = true
[lints]
workspace = true
[dev-dependencies]
tempfile = "3"
