config_version = 1

[workspace]
root = "."
state_file = ".voff/voff.db"

[runtime]
automatic_review = true # Team Lead reviews work; false restores manual approvals
default_timeout_seconds = 1800
event_channel_capacity = 128

[provider]
kind = "mock"
# To use local Ollama instead:
# kind = "ollama"
# base_url = "http://127.0.0.1:11434"
# model = "your-installed-model"
# To use OpenAI Responses API instead (the key stays in the environment or local voff database):
# kind = "openai"
# model = "gpt-5-mini"
# api_key_env = "OPENAI_API_KEY"

# Optional user-supplied rates. Define both to override catalog estimates.
# [cost]
# input_per_million = 0.0
# output_per_million = 0.0
# currency = "USD"

[agent]
name = "Solo Agent"
role = "software_developer"
system_prompt = "Follow repository rules and return verifiable results."
tools = ["file.read", "search.text", "file.patch", "process.test"]
max_output_tokens = 16384
