[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
voff-core = { path = "crates/voff-core", version = "=0.1.0-beta.1" }
voff-provider = { path = "crates/voff-provider", version = "=0.1.0-beta.1" }
voff-storage = { path = "crates/voff-storage", version = "=0.1.0-beta.1" }
voff-engine = { path = "crates/voff-engine", version = "=0.1.0-beta.1" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
