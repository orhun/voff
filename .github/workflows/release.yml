name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: voff-linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: voff-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: voff-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --locked --release -p voff-cli --target "${{ matrix.target }}"
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/voff" dist/voff
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" voff
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          fi
      - name: Verify packaged archive
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${{ matrix.asset }}.tar.gz.sha256"
          else
            shasum -a 256 -c "${{ matrix.asset }}.tar.gz.sha256"
          fi
          verify_dir="$(mktemp -d)"
          tar -C "$verify_dir" -xzf "${{ matrix.asset }}.tar.gz"
          "$verify_dir/voff" --version
          "$verify_dir/voff" init --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
