name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          set -euo pipefail
          for package in \
            voff-core \
            voff-tools \
            voff-prompts \
            voff-provider \
            voff-storage \
            voff-engine \
            voff
          do
            cargo publish --locked --package "$package"
            if [ "$package" != "voff" ]; then
              # Allow the crates.io index to expose each new version before
              # publishing crates that depend on it.
              sleep 30
            fi
          done

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: voff
          - os: macos-14
            target: aarch64-apple-darwin
            binary: voff
          - os: macos-13
            target: x86_64-apple-darwin
            binary: voff
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: voff.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build voff
        run: cargo build --locked --release --package voff --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: voff-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
