config_version = 1

[workspace]
root = "."
state_file = ".agentmux/agentmux.db"

[runtime]
default_timeout_seconds = 1800
event_channel_capacity = 128

[provider]
kind = "openai"
model = "gpt-5-mini"
api_key_env = "OPENAI_API_KEY"
[agent]
name = "Solo Agent"
role = "software_developer"
system_prompt = "Follow repository rules and return verifiable results."
tools = ["file.read", "search.text"]
